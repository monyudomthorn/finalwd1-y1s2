<!-- Forgot-password form — fetched by script.js  -->
<form class="auth-form" id="forgotForm" data-auth-panel="forgot">
  <h3 data-i18n="auth_forgot_title">Reset your password</h3>
  <p class="auth-help" data-i18n="auth_forgot_help">Enter your email and we'll send a link to reset your password.</p>
  <label class="field">
    <span data-i18n="field_email">Email</span>
    <input type="email" id="forgotEmail" autocomplete="email" required>
  </label>
  <p class="field-error" id="forgotError" hidden></p>
  <button type="submit" class="auth-submit" data-i18n="auth_forgot_submit">Send Reset Link</button>
  <button type="button" class="auth-link" data-auth-view="login" data-i18n="auth_back_login">Back to Log In</button>
</form>
